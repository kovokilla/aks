trigger: none
pr: none

pool:
  vmImage: 'ubuntu-latest'

steps:
- checkout: none

- task: AzureCLI@2
  displayName: 'Print Azure subscription ID'
  inputs:
    azureSubscription: 'azure-service-connection'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      az account show --query id --output tsv
