trigger:
- main
- master

variables:
- group: aks-secrets

pool:
  vmImage: 'ubuntu-latest'

steps:
- task: LoginToAzureCLI@2
  displayName: 'Login to Azure'
  inputs:
    azureSubscription: 'azure-service-connection'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      # Set subscription
      az account set --subscription $(AZURE_SUBSCRIPTION_ID)
      
      # Enable extensions
      az extension add --name containerapp
      
      # Check Terraform version
      terraform version

- task: TerraformInstaller@0
  displayName: 'Install Terraform'
  inputs:
    terraformVersion: '1.8.0'

- task: TerraformCLI@0
  displayName: 'Terraform Init'
  inputs:
    command: 'init'
    workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
    providerInstallationRules: 'discover'

- task: TerraformCLI@0
  displayName: 'Terraform Validate'
  inputs:
    command: 'validate'
    workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'

- task: TerraformCLI@0
  displayName: 'Terraform Plan'
  inputs:
    command: 'plan'
    workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
    environmentServiceName: 'azure-service-connection'
    commandOptions: '-out=tfplan'
    backendServiceArm: 'azure-service-connection'
    backendAzureRmResourceGroupName: '$(RESOURCE_GROUP_NAME)'
    backendAzureRmStorageAccountName: '$(STATE_STORAGE_ACCOUNT)'
    backendAzureRmContainerName: 'tfstate'
    backendAzureRmKey: 'aks-cluster.tfstate'

- task: TerraformCLI@0
  displayName: 'Terraform Apply'
  continueOnError: true
  inputs:
    command: 'apply'
    workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
    environmentServiceName: 'azure-service-connection'
    commandOptions: 'tfplan'
    publishProfileResults: true

- task: TerraformCLI@0
  displayName: 'Get AKS Credentials'
  inputs:
    command: 'output'
    workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
    rawOutput: true
  name: outputs

- script: |
    echo "##vso[task.setvariable variable=KUBECONFIG;isOutput:true]$(HOME)/.kube/config"
    az aks get-credentials --resource-group $(RESOURCE_GROUP_NAME) --name $(AKS_CLUSTER_NAME) --admin --overwrite-existing
  displayName: 'Configure kubectl'
  env:
    AZURE_SUBSCRIPTION_ID: $(AZURE_SUBSCRIPTION_ID)

- script: |
    echo "Kubernetes cluster is ready!"
    echo "Cluster: $(AKS_CLUSTER_NAME)"
    echo "Resource Group: $(RESOURCE_GROUP_NAME)"
    echo "Location: $(LOCATION)"
  displayName: 'Display Cluster Information'