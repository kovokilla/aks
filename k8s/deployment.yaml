apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-deployment
  namespace: production
  labels:
    app: azure-aks-demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: azure-aks-demo
  template:
    metadata:
      labels:
        app: azure-aks-demo
    spec:
      containers:
      - name: app
        image: ghcr.io/your-github-username/azure-aks-demo:latest
        ports:
        - containerPort: 8080
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"